[project]
name = "family-chef-server"
version = "0.1.0"
description = "Family Chef backend API and administration service"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "django>=5.2,<6",
  "django-cors-headers>=4.7,<5",
  "django-filter>=25.1,<26",
  "djangorestframework>=3.16,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "dj-database-url>=2.3,<3",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
